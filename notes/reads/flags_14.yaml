racer_notes:
  峰竜太: 34号機（2連率31%の平凡機）だがペラを大きく叩いて「出足も伸びもいい、トップ級」。初日12R 展示最速6.82・逃げ1着
  仲谷颯仁: 79号機。前検6.65（5位）、「出足は良さそう」。初日2R 展示1位→差し1着、8R 3着。スタートの勘とチルト／ペラは調整中
  小池修平: 17号機。前検6.67、初日7R 2コースから直まくり1着。「行き足から伸びへのつながりが良い」
  椎名豊: 15号機は優出6回の実戦向き好機。初日6R はスタート放って6着、11R は展示6.87・ST.04 で逃げ1着。「行き足の雰囲気は良さそう」
  中村日向: 33号機（伸び型の優良機）。初日5R イン受難の日に最初の逃げ切り。「数字ほどは出ていないが水準、及第点」
  濱野谷憲: 22号機。前検6.64（3位タイ）「タイム通りの手応え」。初日6R 1号艇でまくられ2着
  海野康志: 16号機。前検は44位・本人「普通」だが初日は唯一の連勝（4R差し・10Rまくり）。61kg→56kgの減量とペラ調整。展示タイムは遅い（7.09/6.97）のに走る＝出足・まわり足型（推測）
  田中駿兵: 13号機は「行き足系統が抜群」の前評判。初日3R 展示最速→差し1着、10R は本番ST.23 の出遅れで6着。「ターンがパタパタ滑る、調整が合えばいい足に」
  河野大: 25号機は直近4節で2優出の上昇機。「パンチのある仕上がり、伸びは悪くない、出足にやや甘さ」。初日8R 展示2位・5コース4着
  市橋卓士: 81号機。前検6.64（3位タイ）「タイム通りの手応え」。初日6R 6コース4着
  山田康二: 12号機。初日は6コースで2着、11R 展示最速6.81で2着。「レースでは良かった、重たさは調整」
  中村晃朋: 80号機は前回の優出機。前検6.63（2位）、初日8R 展示1位→差し1着。「違和感なし」
  西岡顕心: 27号機。前検タイムは最下位6.86だが本人は「スリットの足もいい、操縦性よくグリップ」。初日2着・3着
  島村隆幸: 61号機。前検は良くなかったがキャブ交換で全体的に良化。初日1R 1着（1号艇）、8R 5着
  安河内健: 32号機（2連率最下位28%）だが前検6.66（6位）、初日6R 4コースまくり1着
  菅章哉: 82号機（2連率トップ・6優出2V）。前検一番時計6.60（チルト3度）。本人は「普通、求めていた伸びではない」。初日12R チルト3.0で6着。機力はエース級、仕上がりは途上
  瓜生正義: 77号機。「悪くない、下がることはない、悪いところがない」。初日7R 4コース2着
  石渡鉄兵: 37号機は「伸び型の優良機」（グラチャン優勝機）だが、初日2R 展示7.04（5位）・1号艇で5着。本人コメントなし。11/7 7R⑥で再確認
  毒島誠: 59号機。初日は展示6.83と速いが「舟が向かない、かなり乗りにくい、出足がない」。2着・3着
  金子拓矢: 67号機。道中・コーナーで競り負ける内容。4着・6着
  桑原悠: 18号機。「すごく下がっている。新ペラがまだ叩けていない」
  吉田拡郎: 62号機。「スタート練習の感じは良くない、スリットの足がほしい」。初日12R 3着
  西野雄貴: 72号機。整備したが「起こしで鳴いた、道中スカっている」
  平本真之: 78号機。「エンジンはイマイチ。チルトを跳ねても伸びなかった」。初日12R 5着
  大上卓人: 19号機。「ペラを回し過ぎた、直線もターンの返りも良くない」。4着・4着
  辻栄蔵: 71号機。「朝は良いかと思ったがレースでは違った」。5着・3着
  山田祐也: 76号機。初日「ダメですね」、展示6位×2で6着・5着。キャブ交換して2日目は上向きの報あり
  渡邉和将: 60号機。前検で若林に伸びられ、回り過ぎ。初日7R 6着
  白井英治: 14号機。「スタートしてからの伸びは良いが、それ以外の足がいけていない」。3着・5着
  渋谷明憲: 29号機。「下がることはない、数字のあるエンジン」。初日10R 2着
  坪井康晴: 51号機。「普通はあった、まあまあ」。2着・5着（1号艇）
  原田幸哉: 53号機。「足は普通ある」。初日12R 4着
  西山貴浩: 55号機。「伸びに振りすぎて重い、手前に調整」。初日12R 3コース差し2着
