up_racers: [椎名豊, 中村日向, 濱野谷憲, 海野康志, 田中駿兵, 河野大, 市橋卓士, 山田康二, 中村晃朋, 西岡顕心, 島村隆幸, 安河内健, 菅章哉, 瓜生正義]
bad_racers: [石渡鉄兵, 毒島誠, 金子拓矢, 桑原悠, 吉田拡郎, 西野雄貴, 平本真之, 大上卓人, 辻栄蔵, 山田祐也, 渡邉和将, 白井英治]
