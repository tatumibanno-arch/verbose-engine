# 鳴門（jcd 14）G1 大渦大賞の運用者メモ（2026-11-07 更新: 前検リポート・公式ピットレポート・スポーツ紙・初日の展示と着順を整理）。直前分析の印に使う。
# 名前は番組表の表記（スペースなし）。◎=好気配・上位級 ↑=気配上向き・好感触 △=劣勢・本人が不満。モーターの印は機歴（公式記者コメント）ベース。
