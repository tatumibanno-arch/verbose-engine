# 住之江（jcd 12）高松宮記念の運用者メモ（前検・住之江ゼミナール1〜2日目の評価を整理、2026-11-07更新）。直前分析の印に使う。
# ◎=好気配・上位級 ↑=気配上向き △=劣勢気配。名前は番組表の表記（4文字に切れている選手あり: 上野真之=上野真之介、豊田健士=豊田健士郎）。
good_racers: [塩田北斗, 石野貴之, 石本裕武, 井上忠政, 大峯豊, 関浩哉, 篠崎仁志, 深谷知博, 西村拓也, 久田敏之, 高橋竜矢, 上條暢嵩, 岩瀬裕亮, 宮田龍馬]
up_racers: [馬場貴也, 萩原秀人, 河合佑樹, 上田龍星, 豊田健士, 上野真之, 佐藤翼, 木下翔太]
bad_racers: [稲田浩二, 村上遼, 中野次郎, 桐生順平, 権藤俊光, 山崎郡, 柳生泰二, 佐々木完, 藤原啓史, 長田頼宗, 山口剛]
good_motors: ["68", "80", "11", "29", "20", "12", "79"]
bad_motors: ["55"]
racer_notes:
  塩田北斗: 前検は「26%の数字ではない・節トップ級」。2日目評価はセット交換で「まともにレースができる気配まで持ち直した」と控えめ。◎は保留気味に見る
  石野貴之: ペラ調整で大きく上向き。2日目評価＝スリットから握った足・手前・出口のかかりが抜群で今節メンバーのトップクラス（79号機も◎）
  松井繁: 前検は舟足トップ級の評価だったが、運用者が2日見て「評価ほど出ていない」（2-6-3）。11/7 から印なし
  桐生順平: 前検は節2〜3番手の評価。運用者が2日見て「評価ほど出ていない」（4-4-4）。公式ピットレポートでは本人「ターンでグリップしてない、握りたいときに握れない、全部割ってみる」。選手△、29号機は機歴で◎のまま（相殺）
  石本裕武: 12号機の大幅整備（ピストン・リング・クランク等）で気配良化
  関浩哉: ターンの乗り心地良し
  篠崎仁志: 舟足良好
  深谷知博: スタートの切れ・伸び良し
  西村拓也: 初日に上向き
  久田敏之: まあまあ出ている
  高橋竜矢: 着順以上に気配良し
  大峯豊: 2日目評価＝パンチ力は今節一番（1-1-2）
  佐藤翼: 前検は△だったが、初日より仕上がりがかなり良くなった（2日目評価）。△→↑
  木下翔太: 2日目に連勝（6-1-1）。舟足は目立たないが、かかり・バランス含め中堅上位（2日目評価、動画では「木下雄介」と呼ばれていたが出場は木下翔太）。↑
  井上忠政: 61号機。初日ピットレポートで自信度★★★「すごくいい調整ができた。住之江でやれる体感。足も言うことない」。1着・2着・4着
  萩原秀人: 56号機。初日「伸びが止まっている」→2日目「重さは解消、伸びも下がらない」
  権藤俊光: 64号機は2連率48%で特設サイトでは「エース格」だが本人「足自体が重たかった、ペラが開いている」。4・6・2着
  山崎郡: 19号機。本人「結果がついてこない、大したことない」★☆☆。6・2・5着
  柳生泰二: 16号機。「足はちょっと劣勢」★☆☆
  佐々木完: 23号機。展示タイムが毎回最下位級、「すごい乗りづらかった」
  藤原啓史: 34号機。「パッとしない、イケてない」。電気一式・リング交換
  長田頼宗: 70号機。「回転が合っていない、手前が来てなくて重い」
  山口剛: 81号機。2日目「出足がない、思ったように曲がれなかった」★☆☆
  馬場貴也: エンストあったが仕上がり悪くない
  中野次郎: 1日目はターン回り良好→2日目の回顧（野添）では成績・気配に変化なしで厳しい評価。↑→△
  稲田浩二: 今節は出足不足で苦しいレースが続く（2日目回顧）。△
  村上遼: 他のメンバーより舟足劣勢、予選突破も厳しい（2日目回顧）。△
  河合佑樹: 28%以上に動く
  上田龍星: 前検より上向き
  豊田健士: レース足良く展開を突ける
  上野真之: 前検は劣勢だったが、セット交換で気配良化（2日目評価）。△→↑
  山田哲也: スタート早いが伸びない
  山崎郡: 伸び良いが出足いまひとつ
  池田浩二: 目立たないが悲観するほどではない
notes:
  "68": 中間整備で一新。セット交換までは「26%の低調機」で引き波をまたぐたびに失速していた。交換後は「まとも」まで持ち直した程度（節トップ級とまでは言っていない）
  "20": 伸び型の好気配
  "80": 安定上位・スリット付近良し
  "11": 出足・ターン回り良し
  "29": 特訓で一変
  "12": パワーユニット大幅整備
  "79": 石野。スリットから握った足・手前・出口のかかりが抜群、今節トップクラス（2日目評価）
  "14": 前検はレース足弱い。セット交換で良化（2日目評価）→ △を外す
  "55": パッとしない
