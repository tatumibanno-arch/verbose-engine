name: live_alert

# 締切前アラート（scripts/live_alert.py、rules.yaml strategies.live_tansho_poolgap_v1）。
# 締切の数分前に単勝・3連単オッズを見て、条件に合う艇を LINE に流す。舟券は買わない。
# ジョブ1本 = rules.yaml の slots 1枠。開始の遅れ（GitHub の schedule は数分〜十数分遅れる）を見込んで早めに起動する。
# 必要な Secrets（Settings → Secrets and variables → Actions）: LINE_CHANNEL_TOKEN, LINE_USER_ID

on:
  # GitHub の schedule は遅れたり動かなかったりしたので使わない。
  # Claude の予約（毎日 08:05 / 12:20 / 16:50 JST）が mode=run で起動する（枠は起動時刻で決まる）。
  workflow_dispatch:
    inputs:
      mode:
        description: "run（今の時刻の枠を動かす） / test（次のレースを1つ判定してテスト送信） / send（file の中身を LINE に送る）"
        default: "test"
      file:
        description: "mode=send のとき送るファイル（作業ブランチ上のパス）"
        default: ""

permissions:
  contents: write

concurrency:
  group: live-alert-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

env:
  WORK_BRANCH: claude/tender-newton-ymc8j0

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WORK_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q requests pandas pyarrow pyyaml

      - name: Run
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
          FILE: ${{ github.event.inputs.file }}
        run: |
          if [ "$MODE" = "send" ]; then
            python scripts/line_push.py --file "$FILE"
          elif [ "$MODE" = "test" ]; then
            python scripts/live_alert.py run --test
          else
            python scripts/live_alert.py run
          fi

      - name: Commit log
        if: always()
        run: |
          git config user.name "live-alert-bot"
          git config user.email "live-alert-bot@users.noreply.github.com"
          git add data/live/log || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "live: 締切前アラートのログ $(TZ=Asia/Tokyo date +%Y%m%d-%H%M)"
          for i in 1 2 3 4; do
            git pull --rebase origin "$WORK_BRANCH" && git push origin "HEAD:$WORK_BRANCH" && exit 0
            sleep $((i * 5))
          done
          exit 1
