name: backfill_web

# boatrace.jp の過去オッズ・直前情報を月ごとに並列で取り込み、data/web/*.parquet として作業ブランチにコミットする。
# （Claude のクラウド環境は会話が止まると休止するので、長い取り込みはこちらで回す）
# 途中で時間切れになった月は、同じ入力でもう一度実行すれば続きから取る。

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "odds2tf / odds3t / oddstf / beforeinfo（カンマ区切り）"
        default: "odds2tf"
      months:
        description: "YYYYMM をスペース区切り（例: 202511 202512 202601）"
        default: "202511 202512 202601 202602 202603 202604 202605 202606 202607 202608 202609 202610"
      workers:
        description: "1ジョブの同時アクセス数"
        default: "4"

permissions:
  contents: write

env:
  WORK_BRANCH: claude/tender-newton-ymc8j0

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      months: ${{ steps.m.outputs.months }}
    steps:
      - id: m
        run: |
          echo "months=$(echo '${{ github.event.inputs.months }}' | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read().split()))')" >> "$GITHUB_OUTPUT"

  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        month: ${{ fromJson(needs.plan.outputs.months) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WORK_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q requests pandas pyarrow pyyaml

      - name: Fetch
        run: python scripts/backfill_web.py fetch --month ${{ matrix.month }} --pages "${{ github.event.inputs.pages }}" --workers ${{ github.event.inputs.workers }} --max-minutes 320

      - name: Commit
        if: always()
        run: |
          git config user.name "backfill-bot"
          git config user.email "backfill-bot@users.noreply.github.com"
          git add data/web || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "backfill: ${{ github.event.inputs.pages }} ${{ matrix.month }}"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "$WORK_BRANCH" && git push origin "HEAD:$WORK_BRANCH" && exit 0
            sleep $((i * 7))
          done
          exit 1
