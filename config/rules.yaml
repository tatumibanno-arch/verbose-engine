# レース選定ルール（現行版）
# これが唯一の正。変更したら version を上げ、notes/decisions.md に日付と理由を1行残す。
version: 1
updated: 2026-11-02
note: 初版。まず「1号艇A1・1コース1着率高め」のレースだけを拾う保守的ルールで、回収率の土台を測る。

# 予算（実験全体の上限。検証期間ぶんを含めて 1万円）
budget:
  total_yen: null        # 実験全体の上限。null なら制限なし（当面は気にしない）。数字を入れると累計で選定を止める
  unit_yen: 100          # 1点の金額。最初の1か月は 100円固定
  max_races: 1           # 1日に買うレース数の上限。4点×100円×1レース = 400円/日 → 約25日分
  allocation: fixed      # fixed（1点 unit_yen 固定）/ equal（日次予算を均等配分、daily_yen が必要）
  daily_yen: null        # allocation: equal のときだけ使う

# 券種と買い目
bet:
  ticket_type: sanrensho          # tansho / nirensho / sanrensho …（boatrace-lzh の名称）
  formation: "1-23-234"           # 1着-2着-3着の候補。展開すると 1-2-3,1-2-4,1-3-2,1-3-4 の4点

# 対象レースの絞り込み（すべて満たすものだけ）
filters:
  venues: []                      # 空なら全場。例: ["24", "12"]
  race_numbers: []                # 空なら全レース。例: [1, 2, 3, 4]
  exclude_night_races: false      # ナイター場を除く

# 1号艇の条件（空欄は無視）
lane1:
  grades: ["A1"]                  # 級別
  min_win_rate_lane1: null        # 1コース1着率（%）の下限。データ項目確定後に使う
  min_motor_2ren: null            # モーター2連率の下限

# 検証の評価軸
evaluation:
  primary: roi                    # 回収率を最優先
  rolling_days: [7, 30]           # 移動平均で見る日数
  min_sample_races: 50            # これ未満ではルールの良し悪しを断定しない
