# レース選定ルール（現行版）
# これが唯一の正。変更したら version を上げ、notes/decisions.md に日付と理由を1行残す。
version: 14
updated: 2026-11-06
note: v14 で直前レポート（住之江・鳴門の深い分析を含む）の LINE を停止。v13 で深い分析に本命・穴の目安を追加。v12 で住之江（deep_venues）の全レースに深い直前分析を送る。v11 で2連単アラートの LINE を停止。v10 で live_watch_report（候補レースの直前レポート）を追加。v9 で2連単アラートの条件を厳しく（ずれ1.6以上・1レース1点）。v8 で2連単の試しアラートの LINE を再開。v7 で2連単の試しアラートの LINE を止めた（記録は続ける）。v6 で sanrentan_ev1_v1（3連単 期待値最大1点、紙上）を追加。v5 で live_2t_poolgap_try（2連単の締切前アラート、試し）を追加。v4 で締切前アラート（単勝）の LINE 通知を止め、記録だけにした。v3 で strategies.live_tansho_poolgap_v1（締切前アラート、紙上）を追加。v2 で strategies.tansho_ev_v1（単勝・1着確率モデル×予想配当、紙上運用）を追加。v1 の 1号艇A1 ルール（lane1_a1）はそのまま。

# 下の budget / bet / filters / lane1 で作るルール（v1 からある「1号艇A1」）の名前。picks.reason の先頭に付く
name: lane1_a1
enabled: true

# 予算・点数（上限はかけない。条件に合うレースがあれば何レースでも、無ければ 0 で構わない）
budget:
  total_yen: null        # 実験全体の上限。null なら制限なし。数字を入れると累計で選定を止める
  unit_yen: 100          # 1点の金額。当面 100円固定
  max_races: null        # 1日のレース数上限。null なら制限なし（条件に合うぶんだけ）
  allocation: fixed      # fixed（1点 unit_yen 固定）/ equal（日次予算を均等配分、daily_yen が必要）
  daily_yen: null        # allocation: equal のときだけ使う

# 券種と買い目（点数は自由。1点でも10点でも、検証して詰めていく）
bet:
  ticket_type: sanrensho          # tansho / nirensho / sanrensho …（boatrace-lzh の名称）
  formation: "1-23-234"           # 1着-2着-3着の候補。展開すると 1-2-3,1-2-4,1-3-2,1-3-4 の4点
                                  # 例: "1-2-3"（1点）/ "1-234-2345"（9点）/ 単勝なら "1" 

# 対象レースの絞り込み（すべて満たすものだけ）
filters:
  venues: []                      # 空なら全場。例: ["24", "12"]
  race_numbers: []                # 空なら全レース。例: [1, 2, 3, 4]
  exclude_night_races: false      # ナイター場を除く

# 1号艇の条件（空欄は無視）
lane1:
  grades: ["A1"]                  # 級別
  min_win_rate_lane1: null        # 1コース1着率（%）の下限。データ項目確定後に使う
  min_motor_2ren: null            # モーター2連率の下限

# 検証の評価軸
evaluation:
  primary: roi                    # 回収率を最優先
  period: month                   # 評価の単位は暦月（1日〜末日）。月次回収率 = 月の払戻合計 ÷ 購入合計
  target_monthly_roi: 1.0         # これを超えた月を「勝ち月」とする
  adopt_window_months: 12         # 採用判定に使う期間（直近の暦月数）
  adopt_min_total_roi: 1.0        # 採用条件1: その期間の通算回収率がこれを超える
  adopt_min_win_months: 8         # 採用条件2: 勝ち月がこの数以上
  rolling_days: [7, 30]           # 移動平均で見る日数
  min_sample_races: 50            # これ未満ではルールの良し悪しを断定しない

# ---------------------------------------------------------------------------
# 追加の戦略（それぞれ独立に買い目を作る。picks.reason の先頭に名前が付き、verify はルール別に集計する）
strategies:
  tansho_ev_v1:
    enabled: true
    note: >-
      notes/analysis/trifecta.md 9節の提案。1着確率 ≥ min_win_prob かつ 1着確率×予想単勝配当/100 ≥ min_ev の艇の単勝。
      発見用 1.017（勝ち月8/12）・検証用 1.012（8/12）。1.0 を超える幅は1〜2%なので、まず紙上で前向きに確かめる。
    paper: 1                      # 1=紙上（記録だけ）。本番で買うと決めたら 0
    ticket_type: tansho
    unit_yen: 100                 # 1点の金額
    min_win_prob: 0.20            # 1着確率の下限
    min_ev: 1.0                   # 1着確率 × 予想単勝配当 / 100 の下限
    venues: []                    # 空なら全場
    race_numbers: []              # 空なら全レース
    model:                        # scripts/model.py が読む。学習済みは data/models/<dir>/<YYYY-MM>/
      dir: tansho_ev
      stats_lag_days: 45          # 期別成績を算出期間の最終日から何日後に使うか（分析と同じ）
      train_months: 24            # 各月、その月より前の何か月で学習するか（末尾 valid_months は早期打ち切り・τ用）
      valid_months: 2
      feature_history_days: 1100  # 特徴量に読む成績の履歴（日）。800日以上なら全期間とほぼ同じ値（速さのため）
      payout_train_from: "2024-05"   # 予想配当モデルの学習に使う最初の月（OOS 予測がある月）
      payout_first_month: "2024-11"  # 予想配当を出す最初の月（seed-history 用。分析と同じ）
      recalib_from: "2024-05"        # 再校正 α に使う最初の月
      recalib_window_months: 12
      recalib_min_races: 3000

  live_tansho_poolgap_v1:
    enabled: true
    kind: live                    # 前夜の選定（select_races）では扱わない。scripts/live_alert.py が当日に動かす
    note: >-
      締切前アラート（2026-11-03 から紙上）。締切 lead_minutes 分前に単勝と3連単のオッズを取り、
      3連単オッズから出した各艇の1着確率 ÷ 単勝オッズから出した1着確率 ≥ min_gap、かつ
      3連単からの1着確率 ≥ min_p3 の艇の単勝を LINE で知らせる。モデルは使わない（市場どうしのずれ）。
      締切確定オッズでの検証（2025-11〜2026-10）は 1日約11点・回収率 2.1・勝ち月 12/12 だが、
      確定オッズを使った後付けの発見で、締切前のオッズでは未確認。最初の1か月は紙上で記録する。
    paper: 1
    send_line: false              # 2026-11-03 運用者の判断で LINE 通知は止めた（単勝は売上が小さく、金額を増やすとオッズが下がる）。オッズの記録だけ続ける
    ticket_type: tansho
    unit_yen: 100
    min_gap: 2.0                  # 3連単由来の1着確率 / 単勝由来の1着確率 の下限
    min_p3: 0.20                  # 3連単由来の1着確率の下限
    lead_minutes: 6               # 締切の何分前にオッズを見るか
    min_lead_minutes: 2           # これより締切が近ければ見送る（買う時間が無い）
    alert_window: ["09:00", "21:00"]   # LINE を送る時間帯（締切時刻で判定）。外は記録だけ
    slots:                        # GitHub Actions のジョブ1本が受け持つ締切時刻の範囲（1本6時間まで）
      - ["08:00", "13:00"]
      - ["13:00", "17:30"]
      - ["17:30", "23:00"]

  live_2t_poolgap_try:
    enabled: true
    kind: live
    note: >-
      2026-11-03 夜の試し（運用者の依頼）。締切 lead_minutes 分前に2連単・3連単のオッズを取り、
      3連単から出した「a-b の順で1・2着」の確率 ÷ 2連単オッズから出した確率 ≥ min_ratio かつ
      3連単からの確率 ≥ min_p3 の2連単を LINE に流す（単勝で見つけた「薄い市場が3連単よりずれる」の2連単版）。
      過去の検証はまだ無い（2連単の過去オッズは取り込み中）。根拠の無い試しとして扱う。
    paper: 1
    send_line: false              # 2026-11-04 昼に停止（運用者: 届いた時と実際のオッズが全然違う）。記録は続ける
    ticket_type: nirensho
    unit_yen: 100
    min_ratio: 1.6                # 3連単由来 / 2連単由来 の下限。推定期待値 ≈ 0.75 × これ（2026-11-04 に 1.4→1.6。通知が多すぎるため）
    min_p3: 0.08                  # 3連単由来の確率の下限
    max_per_race: 1               # 2026-11-04 に 2→1

  sanrentan_ev1_v1:
    enabled: true
    kind: manual                  # 夜の select_races ではまだ動かない（モデルの作業ファイルが要る）。scripts/analysis/sanrentan_today.py で作る
    note: >-
      2026-11-04 から紙上。3連単で、モデル確率 ≥ min_prob の目のうち 期待値（確率×予想配当）最大の1点を、
      期待値 ≥ min_ev のときだけ。multi_bet.md の 3T:EV上位k:g:p>=0.01:k=1:EV>=1.2（発見 1.152・勝ち月4/12・最悪月0.00 /
      検証 1.268・勝ち月8/12・最悪月0.03、月80〜100点・的中4/月）。100候補から後で選んだもので、補正の検証では3連単の期待値は
      まだ甘い（calibration.md）。月4本ほどしか当たらないので月ごとのブレが非常に大きい。
    paper: 1
    ticket_type: sanrensho
    unit_yen: 100
    min_prob: 0.01
    min_ev: 1.2

  live_watch_report:
    enabled: true
    kind: live
    note: >-
      2026-11-04 運用者の依頼。朝に「候補レース」（A1が min_a1 人以上＝SG・G1相当、かつモデルの1号艇1着率 ≥ min_p1）を一覧で送り、
      締切 report_minutes 分前（展示の後）にそのレースだけ直前情報（展示タイム・スタート展示・チルト・部品交換）と
      1着1号艇の3連単の人気上位・合成オッズを LINE に送る。買い目を当てるものではなく、人が判断する材料を届けるもの。
    send_line: false              # 2026-11-06 運用者の判断で直前レポートの LINE を停止（記録は続ける）
    min_a1: 5
    min_p1: 0.5
    report_minutes: 12
    top_combos: 6
    pick:                         # 深い分析の「本命・穴」の目安（データで確かめた値ではない。調整は人の判断で）
      model_weight: 0.5           # 土台の確率 = model_weight × モデル + 残り × 3連単オッズの見立て
      ex_top: 1.10                # 展示1〜2位の艇（1着・2着・3着のどこにいても掛ける）
      ex_bottom: 0.90             # 展示5〜6位
      good: 1.10                  # 前検◎
      up: 1.05                    # 気配上向き ↑
      bad: 0.85                   # 前検△
      honmei_points: 3
      ana_min_odds: 20
      ana_max_odds: 100           # 大穴（100倍超）は市場が買いすぎ・モデルも当てにならないので除く
      ana_min_prob: 0.01          # 補正した確率がこれ未満の目は穴に出さない
      ana_min_ratio: 1.2          # 補正した確率 ÷ オッズの見立て の下限
      ana_points: 3
    deep_venues: ["12", "14"]     # この場は全レースを深い分析で送る（住之江・鳴門）（材料は前夜に scripts/analysis/deep_prep.py が作る）

# ---------------------------------------------------------------------------
# 通知（選定ルールではない。LINE/Slack に送る文面の出し方だけ）
notify:
  summary_only_rules: [lane1_a1, tansho_ev_v1]  # LINE では件数だけ書き、買い目の行は出さない（比較用・単勝は買わない方針）
